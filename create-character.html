<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Character</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
</head>

<body>

    <header class="site-header">
        <div class="container header-inner">
            <h1 class="site-title">D&D Beginner Portal</h1>

            <nav aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="create-character.html" class="active">Create Character</a></li>
                    <li><a href="how-to-play.html">How to Play</a></li>
                    <li><a href="keywords.html">Keywords</a></li>
                    <li><a href="generated-character.html">Generated Character</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">

        <section id="setup-screen" class="card character-start-card">
            <h2>Create Your Character</h2>

            <label for="player-name">Character Name</label>
            <input id="player-name" type="text" placeholder=" --- ">

            <p id="name-error" class="error-message"></p>

            <div class="button-group">
                <button class="button" type="button" onclick="validateAndStartQuiz()">
                    Take the Quiz
                </button>

                <button class="button secondary-button" type="button" onclick="validateAndStartManual()">
                    Pick Manually
                </button>
            </div>
        </section>

        <section id="quiz-screen" class="card quiz-card" style="display:none;">
            <h2>Character Quiz</h2>

            <p id="question-text"></p>

            <div id="options-container"></div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container">
            <p>CS Project • Dungeons & Dragons Beginner Website • 2026</p>
        </div>
    </footer>

    <script src="scripts.js"></script>

    <script>
        function validateName() {
            var nameInput = document.getElementById("player-name");
            var errorMessage = document.getElementById("name-error");

            if (nameInput.value.trim() === "") {
                errorMessage.textContent = "Please enter your character's name first.";
                nameInput.classList.add("input-error");
                return false;
            }

            errorMessage.textContent = "";
            nameInput.classList.remove("input-error");
            return true;
        }

        function validateAndStartQuiz() {
            if (validateName()) {
                startCharacterQuiz();
            }
        }

        function validateAndStartManual() {
            if (validateName()) {
                startManualCreation();
            }
        }
    </script>

</body>

</html>
